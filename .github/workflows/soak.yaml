name: soak

on:
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start the broker
        run: npm run soak:broker

      - name: Test the harness
        run: node --test 'soak/test/*.test.js'

      - name: Soak
        run: npm run soak

      - name: Soak with small frames and frequent heartbeats
        run: npm run soak -- --frame-max 8192 --heartbeat 1
