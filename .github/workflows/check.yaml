name: check

on:
  pull_request:
    branches: [dev, release]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    services:
      rabbitmq:
        image: rabbitmq:4.2-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check
